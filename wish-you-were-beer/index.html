<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050f18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wish Beer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Photograph your drink, stamp it with where, when and how much, and share it. No accounts, nothing stored online.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Wish You Were Beer</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>
  <h1>Wish you were <span>beer</span></h1>
  <p class="sub">Postcards from the pub</p>

  <div class="stage" id="stage">
    <video id="video" playsinline muted aria-label="Camera viewfinder"></video>
    <canvas id="preview" role="img" aria-label="Your finished picture" hidden></canvas>
    <div class="grid" id="grid" aria-hidden="true">
      <i class="v x38"></i><i class="v x62"></i>
      <i class="h y38"></i><i class="h y62"></i>
      <b class="x38 y38"></b><b class="x62 y38"></b>
      <b class="x38 y62"></b><b class="x62 y62"></b>
    </div>
    <div class="stage-msg" id="stageMsg" hidden></div>
  </div>

  <div class="looks" id="looks" role="radiogroup" aria-label="Look" hidden></div>

  <div class="row" id="shootRow">
    <label class="btn">Choose photo<input type="file" id="file" accept="image/*"></label>
    <button class="shutter" id="shutter" aria-label="Take photo"></button>
  </div>
  <div class="row" id="doneRow" hidden>
    <button id="retake">Retake</button>
    <button id="save">Save</button>
    <button class="primary" id="share">Share</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="panel">
    <label class="field">Where
      <input type="text" id="venue" maxlength="48" placeholder="Where are you?" autocomplete="off">
    </label>
    <label class="field">Say something
      <input type="text" id="tag" maxlength="40" placeholder="Wish you were beer" autocomplete="off">
    </label>
    <label class="check"><input type="checkbox" id="priceOn"> Add the price</label>
    <div class="price-row" id="priceRow" hidden>
      <select id="cur" aria-label="Currency"><option>€</option><option>£</option><option>$</option></select>
      <input type="text" id="price" inputmode="decimal" placeholder="7.20" aria-label="Price of the drink" autocomplete="off">
    </div>
  </div>

  <details class="panel">
    <summary>Size and grid</summary>
    <label class="check"><input type="checkbox" id="gridOn" checked> Golden ratio grid</label>
    <div class="seg" role="radiogroup" aria-label="Image size">
      <label><input type="radio" name="fmt" value="square"><span>Square</span></label>
      <label><input type="radio" name="fmt" value="portrait" checked><span>Portrait</span></label>
      <label><input type="radio" name="fmt" value="story"><span>Story</span></label>
    </div>
  </details>

  <p class="note">Everything is drawn into the picture, so there is nothing to type or paste. For adults of legal drinking age. Please drink responsibly.
    <a href="https://youknowthatsite.com/wishyouwerebeer/privacy/" target="_blank" rel="noopener">Privacy</a> ·
    <a href="https://youknowthatsite.com/wishyouwerebeer/support/" target="_blank" rel="noopener">Support</a></p>
</main>
<script src="app.js"></script>
</body>
</html>
